<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="badge-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="word-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="18" y="25" width="150" height="150" rx="38" fill="url(#badge-g)"/>
  <rect x="18" y="25" width="150" height="76" rx="38" fill="url(#shine)"/>

  <!-- sparkle -->
  <path d="M130 46 L134.5 57.5 L146 62 L134.5 66.5 L130 78 L125.5 66.5 L114 62 L125.5 57.5 Z" fill="#ffffff" opacity=".95"/>

  <!-- M monogram -->
  <text x="92" y="140" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="86" font-weight="700" fill="#ffffff" text-anchor="middle">M</text>

  <!-- wordmark -->
  <text x="196" y="122" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="700" fill="url(#word-g)">Mahnoor</text>
</svg>
